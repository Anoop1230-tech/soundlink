[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundlink"
version = "0.1.0"
description = "Send small, secure data packets between devices using sound"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.4.6",
    "PyNaCl==1.6.2",
    "reedsolo==1.7.0",
    "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
soundlink = "soundlink.cli:main"

[tool.setuptools]
packages = ["soundlink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
