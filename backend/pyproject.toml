[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundbank"
version = "0.3.0"
description = "Demo bank for SoundLink offline payments (dummy money)"
requires-python = ">=3.10"
dependencies = [
    "soundlink",
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["soundbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
